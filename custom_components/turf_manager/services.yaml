delete_entry:
  fields:
    entry_id:
      required: true
      selector:
        text:

set_daily_temperature:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: turf_manager
    date:
      required: true
      selector:
        date:
    mean:
      selector:
        number:
          min: -40
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
    min:
      selector:
        number:
          min: -40
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
    max:
      selector:
        number:
          min: -40
          max: 60
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

