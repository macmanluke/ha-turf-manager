get_history:
  fields:
    device_id:
      selector:
        device:
          multiple: true
          filter:
            - integration: turf_manager
    kind:
      selector:
        select:
          multiple: true
          translation_key: kind
          options:
            - application
            - mow
            - activity
    start_date:
      selector:
